<!doctype html>
<html lang="zh-CN" data-theme="4" data-page="projects">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no">
<meta name="description" content="方克铖的编程项目展示">
<meta name="author" content="fingerecho">
<link rel="icon" href="jpg/icon/favicon.gif">
<title>编程项目 - 小方个人网</title>
<link rel="stylesheet" type="text/css" href="lives/css/blog.css">
<style>
	.projects-page {
		width: min(1180px, calc(100% - 32px));
	}

	.projects-head {
		display: flex;
		flex-wrap: wrap;
		align-items: flex-end;
		justify-content: space-between;
		gap: 16px 28px;
		margin-bottom: 6px;
	}

	.projects-head h1 {
		margin: 0 0 10px;
	}

	.projects-sub {
		color: var(--ink-soft);
		font-size: 15px;
		line-height: 1.8;
	}

	.back-link {
		display: inline-flex;
		align-items: center;
		padding: 9px 18px;
		border: 1px solid rgba(255, 255, 255, .16);
		border-radius: 999px;
		background: rgba(12, 16, 30, .7);
		background-image: none;
		color: #dfe6ff;
		font-size: 13px;
		font-weight: 600;
		white-space: nowrap;
	}

	.back-link:hover {
		border-color: var(--a2);
		color: #fff;
		background-size: 0 0;
		text-shadow: none;
	}

	.project-grid {
		display: grid;
		grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
		gap: 18px;
		margin-top: 28px;
	}

	.project-card {
		display: flex;
		flex-direction: column;
		gap: 14px;
		padding: 26px 24px;
		border: 1px solid rgba(255, 255, 255, .1);
		border-radius: 20px;
		background: linear-gradient(180deg, rgba(255, 255, 255, .075), rgba(255, 255, 255, .025));
		box-shadow:
			inset 0 1px 0 rgba(255, 255, 255, .12),
			0 20px 50px -32px rgba(0, 0, 0, .9);
	}

	.project-card h2 {
		margin: 0;
		padding: 0;
		color: #fff;
		font-size: 20px;
		font-weight: 700;
		line-height: 1.35;
		letter-spacing: -.01em;
		overflow-wrap: anywhere;
		background: none;
		-webkit-text-fill-color: initial;
	}

	.project-card h2::after {
		display: none;
	}

	.project-desc {
		color: var(--ink-soft);
		font-size: 15px;
		line-height: 1.82;
		overflow-wrap: anywhere;
	}

	.project-tags {
		display: flex;
		flex-wrap: wrap;
		gap: 8px;
		/* 标签下移：由标签行承担底部对齐，紧贴「查看项目」链接上方 */
		margin-top: auto;
		padding-top: 6px;
	}

	.project-tag {
		display: inline-block;
		padding: 4px 11px;
		border: 1px solid rgba(255, 255, 255, .1);
		border-radius: 999px;
		background: rgba(255, 255, 255, .05);
		color: var(--a3);
		font-size: 12px;
		font-weight: 600;
		line-height: 1.5;
	}

	.project-foot {
		display: flex;
		flex-wrap: wrap;
		align-items: center;
		justify-content: space-between;
		gap: 10px 16px;
		padding-top: 6px;
	}

	.project-status {
		display: inline-flex;
		align-items: center;
		gap: 7px;
		color: #86efac;
		font-size: 12.5px;
		font-weight: 600;
	}

	.project-status::before {
		content: "";
		width: 7px;
		height: 7px;
		border-radius: 50%;
		background: #22c55e;
	}

	/* 进行中的项目：圆点与文字换成琥珀色 */
	.project-status.is-doing {
		color: #fcd34d;
	}

	.project-status.is-doing::before {
		background: #f59e0b;
	}

	.project-link {
		background-image: none;
		color: var(--a3);
		font-size: 14px;
		font-weight: 600;
		padding: 0;
	}

	.project-link:hover {
		color: #fff;
		background-size: 0 0;
		text-shadow: none;
	}

	/* GitHub / Gitee 两个仓库链接：右侧等宽并排，缺一个就只排一个 */
	.project-links {
		display: flex;
		flex-wrap: wrap;
		align-items: center;
		justify-content: flex-end;
		gap: 8px;
	}

	.project-repo {
		display: inline-flex;
		align-items: center;
		justify-content: center;
		min-width: 88px;
		padding: 6px 12px;
		border: 1px solid rgba(255, 255, 255, .14);
		border-radius: 999px;
		background: rgba(255, 255, 255, .05);
		font-size: 12.5px;
		line-height: 1.5;
		white-space: nowrap;
	}

	.project-repo:hover {
		border-color: var(--a2);
	}

	.project-empty {
		color: var(--ink-soft);
		font-size: 15px;
		line-height: 1.8;
	}

	@media (max-width: 620px) {
		.projects-page {
			width: calc(100% - 20px);
		}

		.project-card {
			padding: 22px 18px;
		}

		.projects-head {
			align-items: flex-start;
		}

		/* 窄屏：两个仓库链接各占一半，避免挤压换行 */
		.project-links {
			width: 100%;
		}

		.project-repo {
			flex: 1 1 0;
			min-width: 0;
		}
	}
</style>
</head>
<body>
<div class="blog-bg" aria-hidden="true"></div>
<div class="blog-grid" aria-hidden="true"></div>
<main class="article projects-page">
	<div class="projects-head">
		<div>
			<h1>编程项目</h1>
			<div class="projects-sub">持续学习，持续构建。这里收录我开源与自研的编程项目。</div>
		</div>
		<a class="back-link" href="index.html">← 返回首页</a>
	</div>

	<div class="project-grid" id="projectGrid"></div>
</main>
<script src="js/projects.data.js"></script>
<script>
/*
 * 渲染策略（对应「不占资源」的前提）：
 *   1. 全部卡片拼成一段字符串，只写一次 innerHTML —— 只触发一次样式计算与布局；
 *   2. 不注册任何事件监听器、不用 setInterval / requestAnimationFrame；
 *   3. 脚本在 <body> 末尾同步执行一次即结束，之后 CPU / GPU 占用归零，
 *      页面动效仍只有原有的 hover 颜色过渡，没有新增动画。
 */
(function () {
	var grid = document.getElementById("projectGrid");
	if (!grid) { return; }

	var list = window.PROJECTS || [];
	if (!list.length) {
		grid.innerHTML = '<div class="project-empty">项目配置为空，请检查 js/projects.data.js。</div>';
		return;
	}

	// HTML 转义，保证描述里出现 < > & " 也不会破坏结构（属性一律用双引号，故单引号无需转义）
	function esc(s) {
		return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
			return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
		});
	}

	// 仓库链接标签：地址为空则返回空串，即完全不渲染
	function repo(label, url, name) {
		if (!url) { return ""; }
		return '<a class="project-link project-repo" href="' + esc(url) +
			'" target="_blank" rel="noopener noreferrer" title="在 ' + label + ' 查看 ' + esc(name) + '">' +
			label + "</a>";
	}

	var out = [], i, p, t, tags, links, head;
	for (i = 0; i < list.length; i++) {
		p = list[i] || {};

		tags = "";
		for (t = 0; t < (p.tags || []).length; t++) {
			tags += '<span class="project-tag">' + esc(p.tags[t]) + "</span>";
		}

		links = repo("GitHub", p.links && p.links.github, p.name) +
				repo("Gitee", p.links && p.links.gitee, p.name);

		// 有案例链接 → 用「查看案例」取代「已完成」；没有 → 显示完成度
		head = (p.links && p.links.demo)
			? '<a class="project-link" href="' + esc(p.links.demo) +
			  '" target="_blank" rel="noopener noreferrer" title="查看在线案例">查看案例 →</a>'
			: '<span class="project-status' + (p.done === false ? " is-doing" : "") + '">' +
			  esc(p.progress || "已完成") + "</span>";

		out.push(
			'<article class="project-card">' +
				"<h2>" + esc(p.name) + "</h2>" +
				'<div class="project-desc">' + esc(p.desc) + "</div>" +
				'<div class="project-tags">' + tags + "</div>" +
				'<div class="project-foot">' + head +
					'<div class="project-links">' + links + "</div>" +
				"</div>" +
			"</article>"
		);
	}

	grid.innerHTML = out.join("");
})();
</script>
<noscript>
	<div class="article projects-page">
		<div class="project-grid">
			<article class="project-card">
				<h2>需要开启 JavaScript</h2>
				<div class="project-desc">项目列表由 js/projects.data.js 提供，请在浏览器中允许脚本后重新打开本页面。</div>
			</article>
		</div>
	</div>
</noscript>
</body>
</html>
